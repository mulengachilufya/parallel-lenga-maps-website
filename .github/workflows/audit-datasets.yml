name: Audit datasets

# Opens every catalogue file with GDAL and reports broken or suspect files
# (see scripts/audit-datasets.py). Optionally writes a GeoPackage next to
# every zipped shapefile. The report is attached to the run and shown in
# its summary.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Only files whose key or dataset contains this text (empty = all)'
        required: false
        default: ''
      gpkg:
        description: 'Also write a single-file GeoPackage next to every zipped shapefile'
        type: boolean
        default: false
  schedule:
    - cron: '41 3 * * 1'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin python3-boto3
      - name: Audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          ONLY: ${{ github.event.inputs.only }}
          GPKG: ${{ github.event.inputs.gpkg }}
        run: |
          set --
          if [ -n "$ONLY" ]; then set -- "$@" --only "$ONLY"; fi
          if [ "$GPKG" = "true" ]; then set -- "$@" --gpkg; fi
          python3 scripts/audit-datasets.py "$@"
      - name: Summary
        if: always()
        run: cat audit-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: audit-report.*
