# Uptime watch, independent of the website and of Vercel.
#
# Every 15 minutes GitHub checks https://www.lengamaps.com/api/ops/ping
# (database + sign-in). If it fails twice in a row, it opens an issue
# titled "Lenga Maps is down"; GitHub emails and notifies the repository
# owner. When the site recovers, the issue is closed with a note.
# No secrets needed.

name: Uptime

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check the site
        id: check
        run: |
          ok=0
          for i in 1 2; do
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 20 https://www.lengamaps.com/api/ops/ping || echo 000)
            echo "attempt $i: HTTP $code $(cat body.json 2>/dev/null)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 60
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "detail=HTTP $code $(cat body.json 2>/dev/null | head -c 300)" >> "$GITHUB_OUTPUT"
      - name: Open or close the "down" issue
        uses: actions/github-script@v7
        env:
          OK: ${{ steps.check.outputs.ok }}
          DETAIL: ${{ steps.check.outputs.detail }}
        with:
          script: |
            const title = 'Lenga Maps is down'
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'site-down' })
            if (process.env.OK === '1') {
              for (const i of open) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: `✅ Back up at ${new Date().toISOString()}.` })
                await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed' })
              }
              return
            }
            if (open.length) return
            await github.rest.issues.create({ ...context.repo, title, labels: ['site-down'], body: [
              `The uptime check failed twice at ${new Date().toISOString()}.`, '',
              `Result: \`${process.env.DETAIL}\``, '',
              '**What to do**',
              '1. Open https://www.lengamaps.com/ops. If it loads, the Health tab says what is broken.',
              '2. If nothing loads: Actions → Emergency → Run workflow → `health`. It checks the database and sign-in directly.',
              '3. Database down → supabase.com (restore if paused; status.supabase.com). Website down but database fine → vercel.com → Deployments → last good one → Promote to Production.',
              '4. Full steps: docs/RUNBOOK.md.',
            ].join('\n') })
