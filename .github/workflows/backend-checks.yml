name: Backend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 4s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild empty database
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/platform-shim.sql
          bash scripts/bootstrap-database.sh | psql -X -v ON_ERROR_STOP=1
      - name: Exercise payment, API quota and workspace invariants
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/backend-reliability.sql

  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: local-build-placeholder
