name: Build fast map layers

# Converts catalogue rasters into Cloud Optimized GeoTIFFs (web/… in R2) so
# the workspace map streams only what it shows. See scripts/build-web-layers.py.
# Run it by hand after adding datasets; it also runs weekly and skips files
# that are already done.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Only keys containing this text (e.g. lulc/ or Zambia). Empty = all.'
        required: false
        default: ''
      force:
        description: 'Rebuild files that already have a web version'
        type: boolean
        default: false
  schedule:
    - cron: '17 2 * * 0'

concurrency:
  group: build-web-layers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin python3-boto3
          gdalinfo --version
      - name: Build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          ONLY: ${{ github.event.inputs.only }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set --
          if [ -n "$ONLY" ]; then set -- "$@" --only "$ONLY"; fi
          if [ "$FORCE" = "true" ]; then set -- "$@" --force; fi
          python3 scripts/build-web-layers.py "$@"
