# Emergency tools that work even when the website is down.
#
# How to use (phone or computer): GitHub → this repository → Actions →
# "Emergency" → Run workflow → pick what to do, fill in the boxes → Run.
# The result appears in the run's log a few seconds later (addresses are
# masked because this repository is public).
#
# One-time setup: Settings → Secrets and variables → Actions → add
#   SUPABASE_URL               (Supabase → Project Settings → API → URL)
#   SUPABASE_SERVICE_ROLE_KEY  (same page, "service_role" secret)
# Only people with write access to the repository can run this.

name: Emergency

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        options:
          - health
          - lookup
          - grant
          - revoke
          - confirm
          - login-link
          - maintenance-on
          - maintenance-off
          - banner
          - banner-off
      email:
        description: Customer email (lookup, grant, revoke, confirm, login-link)
        required: false
        type: string
      value:
        description: "grant: months (1-24) or permanent · maintenance-on / banner: the message"
        required: false
        type: string
      team:
        description: "grant: give Team access instead of Individual"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hide the email from the log
        if: ${{ inputs.email != '' }}
        env:
          EMAIL: ${{ inputs.email }}
        run: echo "::add-mask::$EMAIL"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACTION: ${{ inputs.action }}
          EMAIL: ${{ inputs.email }}
          VALUE: ${{ inputs.value }}
          TEAM: ${{ inputs.team && 'team' || '' }}
        run: |
          case "$ACTION" in
            maintenance-on|banner) node scripts/ops-cli.mjs "$ACTION" "$VALUE" ;;
            grant)                 node scripts/ops-cli.mjs grant "$EMAIL" "${VALUE:-3}" "$TEAM" ;;
            *)                     node scripts/ops-cli.mjs "$ACTION" "$EMAIL" ;;
          esac
